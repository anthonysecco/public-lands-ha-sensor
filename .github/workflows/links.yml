name: Link check

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "scripts/check_links.py"
      - "custom_components/public_lands/const.py"
      - "custom_components/public_lands/rules.py"
      - "custom_components/public_lands/forests.py"
      - ".github/workflows/links.yml"

permissions:
  contents: read

jobs:
  links:
    name: Data services and agency links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check links
        run: python scripts/check_links.py
